workflows:
  ios-app-store:
    name: Haksup iOS App Store Upload
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.haksup.haksupApp

      # Codemagic UI → Environment variables → 그룹 `haksup_vite`:
      #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (필수)
      #   VITE_DEMO_INVITE_CODE, VITE_DEMO_LOGIN_PASSWORD  (심사용 데모)
      # VITE_APP_REVIEW_DEMO 는 아래 vars 로 iOS 빌드에 켠다.
      groups:
        - haksup_vite
      vars:
        APP_VERSION: "1.1"
        APP_STORE_APPLE_ID: "6754501427"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        VITE_APP_REVIEW_DEMO: "true"

      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Check Vite / Supabase env
        script: |
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 가 비어 있습니다."
            echo "Codemagic → Environment variables → 그룹 haksup_vite 에 넣고 다시 빌드하세요."
            exit 1
          fi
          echo "Supabase URL prefix: ${VITE_SUPABASE_URL:0:40}..."
          echo "VITE_APP_REVIEW_DEMO=${VITE_APP_REVIEW_DEMO:-}"
          if [ "${VITE_APP_REVIEW_DEMO:-}" = "true" ] && [ -z "${VITE_DEMO_INVITE_CODE:-}" ]; then
            echo "WARNING: 심사용 데모가 켜져 있는데 VITE_DEMO_INVITE_CODE 가 비어 있습니다."
          fi

      - name: Build React app
        script: |
          npm run build

      - name: Create and sync iOS project
        script: |
          sed -i '' 's/com.haksup.haksup_app/com.haksup.haksupApp/g' capacitor.config.ts

          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap sync ios

      - name: Register login deep link scheme
        script: |
          # ios/ 는 빌드마다 새로 만들어지므로 Info.plist도 매번 다시 심는다.
          # 이게 없으면 소셜 로그인이 끝나도 haksup:// 로 앱이 열리지 않아
          # 학생이 사파리(웹앱)에 남는다. (src/lib/native.ts 의 NATIVE_AUTH_SCHEME)
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.haksup.haksupApp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string haksup" "$PLIST"

          echo "등록된 URL 스킴:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Generate iOS app icon
        script: |
          echo "Using new app icon:"
          ls -lh assets/icon.png

          npx @capacitor/assets generate \
            --ios \
            --assetPath assets

          echo "Generated iOS icons:"
          ls -lh ios/App/App/Assets.xcassets/AppIcon.appiconset/

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"

      - name: Set app version and build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"

          echo "Setting app version to $APP_VERSION"
          agvtool new-marketing-version "$APP_VERSION"

          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number \
            "$APP_STORE_APPLE_ID" \
            --version-string "$APP_VERSION")

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest uploaded build: $LATEST_BUILD_NUMBER"
          echo "New build number: $NEW_BUILD_NUMBER"

          agvtool new-version -all "$NEW_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false