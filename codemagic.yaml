workflows:
  ios-setup-check:
    name: Haksup iOS Setup Check
    instance_type: mac_mini_m2
    max_build_duration: 30

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build React app
        script: |
          npm run build

      - name: Create iOS project
        script: |
          sed -i '' 's/com.haksup.haksup_app/com.haksup.haksupApp/g' capacitor.config.ts
          npx cap add ios
          npx cap sync ios

      - name: Check iOS project
        script: |
          ls -la ios/App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings >/dev/null
          