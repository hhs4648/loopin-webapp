<svg xmlns="http://www.w3.org/2000/svg" width="393" height="341.848" viewBox="0 29.0667 393 341.848" fill="none">
<!--
  학원/학교 메인 맵의 길 — 세로로 반복(repeat-y)해서 맵 전체를 만드는 타일 1장.
  원본: Figma export `map-path.svg` (시작 41,29.07 → 끝 28,396.87 = 정확히 1주기).

  이 파일이 원본과 다른 점:
  1) 끝점 x를 28 → 41로 당겨 시작점과 맞췄다. 안 그러면 이음새마다 13px 턱이 생긴다.
  2) **흰 글로우(가우시안 블러) 없음** (2026-09-05). 예전엔 테두리처럼 보이는 외곽선이
     생겼다. 지금은 `#FFF59D` 획만 그린다. 글로우가 없으므로 이웃 주기 복사본도 불필요.
  3) **y 좌표에 세로 배율 0.929424를 미리 반영해 두었다.**
     `transform="scale(1, 0.929424)"` 로 눌러 그리면 stroke 에도 비균등 배율이 걸려
     수평 구간이 얇아진다. 좌표를 미리 계산해 넣으면 획이 어디서나 16.
     y' = 29.0667 + (y − 29.0667) × 0.929424

  좌표·주기는 `assignment-home.ts`의 MAP_PATH_* 와 짝이므로 한쪽만 고치지 말 것.
  이 파일을 고치면 `MAIN_HOME_ASSETS`의 `?v=` 숫자도 올릴 것.
-->
<defs>
  <path id="p" fill="none" stroke="#FFF59D" stroke-width="16" stroke-linecap="round"
    d="M41 29.0667C63.5 25.8137 99.9 27.4908 119.5 83.2543C124.828 98.4144 137.014 109.1461 152.086 116.732C206.723 144.2379 280.176 176.1623 285.147 233.7264C287.573 261.8281 275.516 283.027 223 282.1488C111.8 280.29 47.6667 340.7122 41 370.9147"/>
</defs>
<use href="#p" transform="translate(39,0)"/>
</svg>
