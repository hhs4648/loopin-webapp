<svg xmlns="http://www.w3.org/2000/svg" width="393" height="381.848" viewBox="0 -10.9333 393 381.848" fill="none">
<!--
  길의 **첫 주기**. 반복 타일(`map-path-tile.svg`)과 두 가지가 다르다.

  1) **앞 주기 복사본을 그리지 않는다** — 곡선이 둥근 캡으로 시작하게.
     반복 타일만 깔면 화면 맨 위에서 길이 잘린 채 흘러나와 어색하다.

  2) **첫 곡선(`p-first`)은 앞부분을 왼쪽으로 당겼다.**
     구 맵 실측: 길이 프레임 x≈55(중심선)에서 시작해 깃발(x 33~86)과 겹친다.
     반복 곡선 그대로면 x=80에서 시작해 깃발 오른쪽에 떠 있는 것처럼 보인다.
     시작점을 −25 옮기고 그 이동량을 뒤로 갈수록 0으로 줄여
     주기 끝에서는 반복 곡선과 정확히 일치시킨다.

  3) **상단 패딩 40px** (`viewBox` y = 29.0667−40).
     둥근 캡이 잘리지 않게. (예전 흰 글로우용이었으나 캡용으로 유지)

  4) **흰 글로우(테두리처럼 보이던 블러) 없음** (2026-09-05).

  y 좌표에 세로 배율 0.929424가 미리 반영돼 있다 — 이유는 `map-path-tile.svg` 주석 참고.

  이 파일을 고치면 `MAIN_HOME_ASSETS`의 `?v=` 숫자도 올릴 것.
-->
